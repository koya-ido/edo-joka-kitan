<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" font-family="sans-serif">
  <rect width="1120" height="620" fill="#FFFFFF" />

  <!-- Title -->
  <text x="40" y="44" font-size="20" font-weight="bold" fill="#111111">UIコンポーネント 2層アーキテクチャ &amp; 依存境界図</text>
  <text x="40" y="68" font-size="13" fill="#444444">調達プリミティブ層 (components/ui/) と共有ラッパー層 (components/shared/) の責務分離と単方向依存ルール</text>

  <!-- Layer 1: features -->
  <rect x="40" y="96" width="660" height="100" rx="10" fill="#F8FAFC" stroke="#1E293B" stroke-width="2" />
  <text x="64" y="126" font-size="15" font-weight="bold" fill="#0F172A">1. 機能画面層 (features/*)</text>
  <text x="64" y="148" font-size="12" fill="#334155">画面固有レイアウト構成・ドメインフック呼び出し (home, stage-select, battle, gacha, enhance, formation)</text>
  <rect x="64" y="160" width="140" height="24" rx="4" fill="#E2E8F0" />
  <text x="134" y="176" font-size="11" text-anchor="middle" fill="#1E293B">画面固有オーケストレーション</text>
  <rect x="216" y="160" width="160" height="24" rx="4" fill="#E2E8F0" />
  <text x="296" y="176" font-size="11" text-anchor="middle" fill="#1E293B">Canvas 2D ref 分離管理</text>
  <rect x="388" y="160" width="180" height="24" rx="4" fill="#E2E8F0" />
  <text x="478" y="176" font-size="11" text-anchor="middle" fill="#1E293B">直接 indexedDB アクセス禁止</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="370" y1="196" x2="370" y2="234" stroke="#1E293B" stroke-width="2" />
  <polygon points="364,228 376,228 370,238" fill="#1E293B" />
  <text x="384" y="220" font-size="11" fill="#334155">画面要件に応じたデータ・コールバック注入</text>

  <!-- Layer 2: components/shared -->
  <rect x="40" y="240" width="660" height="120" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="2" />
  <text x="64" y="270" font-size="15" font-weight="bold" fill="#78350F">2. 共有ラッパー層 (components/shared/*)</text>
  <text x="64" y="292" font-size="12" fill="#92400E">複数画面で再利用する業務ロジック・ドメイン型・5大ステート結合済みUIブロック</text>
  <rect x="64" y="308" width="136" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" />
  <text x="132" y="330" font-size="11" font-weight="bold" text-anchor="middle" fill="#78350F">AppShell / Header</text>
  <rect x="212" y="308" width="136" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" />
  <text x="280" y="330" font-size="11" font-weight="bold" text-anchor="middle" fill="#78350F">CurrencyPill</text>
  <rect x="360" y="308" width="150" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" />
  <text x="435" y="330" font-size="11" font-weight="bold" text-anchor="middle" fill="#78350F">ConfirmDialog / Toast</text>
  <rect x="522" y="308" width="158" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" />
  <text x="601" y="330" font-size="11" font-weight="bold" text-anchor="middle" fill="#78350F">5-State Views / Cards</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="370" y1="360" x2="370" y2="398" stroke="#1E293B" stroke-width="2" />
  <polygon points="364,392 376,392 370,402" fill="#1E293B" />
  <text x="384" y="384" font-size="11" fill="#334155">Compound Component API 経由で利用 (生タグ直書き禁止)</text>

  <!-- Layer 3: components/ui -->
  <rect x="40" y="404" width="660" height="106" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2" />
  <text x="64" y="434" font-size="15" font-weight="bold" fill="#1E3A8A">3. 調達プリミティブ層 (components/ui/*)</text>
  <text x="64" y="456" font-size="12" fill="#1E40AF">ドメイン非依存・純粋UIプリミティブ (Colocated Pattern + index.ts バレル公開)</text>
  <rect x="64" y="470" width="120" height="26" rx="4" fill="#DBEAFE" stroke="#3B82F6" />
  <text x="124" y="487" font-size="11" text-anchor="middle" fill="#1E3A8A">Dialog / AlertDialog</text>
  <rect x="196" y="470" width="110" height="26" rx="4" fill="#DBEAFE" stroke="#3B82F6" />
  <text x="251" y="487" font-size="11" text-anchor="middle" fill="#1E3A8A">Tabs / RadioGroup</text>
  <rect x="318" y="470" width="110" height="26" rx="4" fill="#DBEAFE" stroke="#3B82F6" />
  <text x="373" y="487" font-size="11" text-anchor="middle" fill="#1E3A8A">Progress / Toggle</text>
  <rect x="440" y="470" width="110" height="26" rx="4" fill="#DBEAFE" stroke="#3B82F6" />
  <text x="495" y="487" font-size="11" text-anchor="middle" fill="#1E3A8A">Popover / Tooltip</text>
  <rect x="562" y="470" width="118" height="26" rx="4" fill="#DBEAFE" stroke="#3B82F6" />
  <text x="621" y="487" font-size="11" text-anchor="middle" fill="#1E3A8A">Button / Badge / Text</text>

  <!-- Layer 4: Foundation Libraries -->
  <rect x="40" y="534" width="660" height="58" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5" />
  <text x="64" y="558" font-size="13" font-weight="bold" fill="#334155">基盤ライブラリ &amp; トークン: Radix UI Primitives (WAI-ARIA/Focus) + Tailwind CSS (和風トークン) + Lucide Icons</text>
  <text x="64" y="578" font-size="11" fill="#475569">視覚スタイルを持たないヘッドレスプリミティブを調達し、和風トークンで装飾</text>

  <!-- Right Side: Domain & Data & Rules -->
  <rect x="740" y="96" width="340" height="170" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="2" />
  <text x="764" y="126" font-size="15" font-weight="bold" fill="#14532D">Domain / Data / Storage 層</text>
  <text x="764" y="150" font-size="12" fill="#166534">• domain/: 純粋TS (React非依存)</text>
  <text x="764" y="172" font-size="12" fill="#166534">• data/: キャラ・武器・ステージマスタ</text>
  <text x="764" y="194" font-size="12" fill="#166534">• storage/: IndexedDB (idb) 永続化</text>
  <text x="764" y="220" font-size="11" fill="#15803D">※ shared/* は domain 型のみ参照可</text>
  <text x="764" y="240" font-size="11" fill="#15803D">※ ui/* からの参照は厳禁 (純粋UI維持)</text>

  <!-- Arrow features -> domain -->
  <line x1="700" y1="146" x2="736" y2="146" stroke="#15803D" stroke-width="2" />
  <polygon points="730,140 730,152 740,146" fill="#15803D" />

  <!-- Arrow shared -> domain (type only) -->
  <line x1="700" y1="280" x2="760" y2="266" stroke="#15803D" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="712" y="294" font-size="10" fill="#15803D">型定義・表示書式のみ参照</text>

  <!-- Forbidden Box -->
  <rect x="740" y="300" width="340" height="210" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2" />
  <text x="764" y="330" font-size="15" font-weight="bold" fill="#7F1D1D">禁止事項 (Guardrails)</text>
  <text x="764" y="356" font-size="12" fill="#991B1B">1. 調達済みプリミティブの div+CSS 自前再実装</text>
  <text x="764" y="380" font-size="12" fill="#991B1B">2. window.alert() / window.confirm() 使用</text>
  <text x="764" y="404" font-size="12" fill="#991B1B">3. 生のカラーコード (#fff 等) の直書き</text>
  <text x="764" y="428" font-size="12" fill="#991B1B">4. ui/* 層へのドメインロジック・hooks 混入</text>
  <text x="764" y="452" font-size="12" fill="#991B1B">5. index.ts バレルを迂回した内部直接 import</text>
  <text x="764" y="476" font-size="12" fill="#991B1B">6. 1ファイル 200行超過 (機能単位で分割)</text>
</svg>

