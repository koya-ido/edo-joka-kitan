<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="sans-serif">
  <rect width="1120" height="560" fill="#FFFFFF" />

  <!-- Title -->
  <text x="40" y="44" font-size="20" font-weight="bold" fill="#111111">5大ステート表示制御 &amp; 共通ダイアログ状態遷移図</text>
  <text x="40" y="68" font-size="13" fill="#444444">非同期トランザクション中の二重押下防止 (isPending) と open / onOpenChange によるモーダル排他制御</text>

  <!-- Left Section: 5-State Wrapper Flow -->
  <rect x="40" y="96" width="520" height="430" rx="10" fill="#F8FAFC" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="128" font-size="15" font-weight="bold" fill="#0F172A">A. StateContainer / 5大ステート描画分岐</text>

  <!-- Loading -->
  <rect x="64" y="150" width="210" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
  <text x="169" y="176" font-size="13" font-weight="bold" text-anchor="middle" fill="#1E40AF">1. Loading</text>
  <text x="169" y="196" font-size="11" text-anchor="middle" fill="#1E3A8A">「霊脈接続中…」表示</text>
  <text x="169" y="212" font-size="11" text-anchor="middle" fill="#1E3A8A">全操作・遷移ボタンをロック</text>

  <!-- Error -->
  <rect x="324" y="150" width="210" height="72" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" />
  <text x="429" y="176" font-size="13" font-weight="bold" text-anchor="middle" fill="#991B1B">2. Error</text>
  <text x="429" y="196" font-size="11" text-anchor="middle" fill="#7F1D1D">ロールバック + Toast通知</text>
  <text x="429" y="212" font-size="11" text-anchor="middle" fill="#7F1D1D">再試行 / 初期化復旧バナー</text>

  <!-- Empty -->
  <rect x="64" y="256" width="210" height="72" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5" />
  <text x="169" y="282" font-size="13" font-weight="bold" text-anchor="middle" fill="#334155">3. Empty</text>
  <text x="169" y="302" font-size="11" text-anchor="middle" fill="#475569">初期状態 / 候補なし案内</text>
  <text x="169" y="318" font-size="11" text-anchor="middle" fill="#475569">次アクション CTA を提示</text>

  <!-- Success -->
  <rect x="324" y="256" width="210" height="72" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" />
  <text x="429" y="282" font-size="13" font-weight="bold" text-anchor="middle" fill="#166534">4. Success</text>
  <text x="429" y="302" font-size="11" text-anchor="middle" fill="#14532D">データ・HUD・一覧を描画</text>
  <text x="429" y="318" font-size="11" text-anchor="middle" fill="#14532D">事前条件を満たす操作を有効化</text>

  <!-- Disabled -->
  <rect x="194" y="362" width="210" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
  <text x="299" y="388" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400E">5. Disabled (事前条件ガード)</text>
  <text x="299" y="408" font-size="11" text-anchor="middle" fill="#78350F">通貨不足 / 未解放 / 上限到達</text>
  <text x="299" y="424" font-size="11" text-anchor="middle" fill="#78350F">不足理由を明記して押下不可</text>

  <!-- Arrows between states -->
  <line x1="274" y1="186" x2="320" y2="186" stroke="#DC2626" stroke-width="1.5" />
  <polygon points="315,181 315,191 324,186" fill="#DC2626" />
  <line x1="169" y1="222" x2="169" y2="252" stroke="#64748B" stroke-width="1.5" />
  <polygon points="164,247 174,247 169,256" fill="#64748B" />
  <line x1="274" y1="292" x2="320" y2="292" stroke="#16A34A" stroke-width="1.5" />
  <polygon points="315,287 315,297 324,292" fill="#16A34A" />
  <line x1="429" y1="328" x2="380" y2="360" stroke="#D97706" stroke-width="1.5" />

  <text x="64" y="476" font-size="11" fill="#334155">※ すべてのデータ駆動画面・非同期ボタンは isPending: boolean で二重送信を防止</text>
  <text x="64" y="496" font-size="11" fill="#334155">※ エラー時は IndexedDB 変更をロールバックし、Toast + インライン復旧導線を表示</text>

  <!-- Right Section: Modal Governance -->
  <rect x="590" y="96" width="490" height="430" rx="10" fill="#F8FAFC" stroke="#334155" stroke-width="1.5" />
  <text x="614" y="128" font-size="15" font-weight="bold" fill="#0F172A">B. モーダル共通制御 (Dialog / AlertDialog)</text>

  <!-- Closed -->
  <rect x="630" y="156" width="160" height="54" rx="8" fill="#E2E8F0" stroke="#475569" stroke-width="1.5" />
  <text x="710" y="180" font-size="13" font-weight="bold" text-anchor="middle" fill="#1E293B">Closed</text>
  <text x="710" y="198" font-size="11" text-anchor="middle" fill="#475569">open = false</text>

  <!-- Open Idle -->
  <rect x="860" y="156" width="180" height="54" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
  <text x="950" y="180" font-size="13" font-weight="bold" text-anchor="middle" fill="#1E40AF">Open (Idle)</text>
  <text x="950" y="198" font-size="11" text-anchor="middle" fill="#1E3A8A">open = true, isPending = false</text>

  <!-- Open Pending -->
  <rect x="860" y="266" width="180" height="64" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
  <text x="950" y="290" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400E">Open (Pending)</text>
  <text x="950" y="308" font-size="11" text-anchor="middle" fill="#78350F">isPending = true</text>
  <text x="950" y="322" font-size="10" text-anchor="middle" fill="#78350F">閉じる / Escape / 再押下を抑止</text>

  <!-- Arrows -->
  <line x1="790" y1="175" x2="856" y2="175" stroke="#2563EB" stroke-width="1.5" />
  <polygon points="850,170 850,180 860,175" fill="#2563EB" />
  <text x="823" y="166" font-size="10" text-anchor="middle" fill="#1E40AF">Trigger</text>

  <line x1="860" y1="196" x2="794" y2="196" stroke="#475569" stroke-width="1.5" />
  <polygon points="800,191 800,201 790,196" fill="#475569" />
  <text x="827" y="212" font-size="10" text-anchor="middle" fill="#475569">onOpenChange(false)</text>

  <line x1="950" y1="210" x2="950" y2="262" stroke="#D97706" stroke-width="1.5" />
  <polygon points="945,256 955,256 950,266" fill="#D97706" />
  <text x="960" y="242" font-size="10" fill="#92400E">確定アクション</text>

  <!-- Rules Table inside right box -->
  <rect x="614" y="362" width="442" height="142" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="630" y="386" font-size="12" font-weight="bold" fill="#0F172A">モーダル種別ごとの閉じ方・排他制御ポリシー</text>
  <text x="630" y="408" font-size="11" fill="#334155">• AlertDialog (初期化/撤退): Backdrop/Escape 無効化・明示ボタンのみ</text>
  <text x="630" y="428" font-size="11" fill="#334155">• Battle 3択 / リザルト: 選択完了または帰還まで背面操作を完全ブロック</text>
  <text x="630" y="448" font-size="11" fill="#334155">• ログボ / ポーズ / ガチャ結果: 閉じた際にフォーカスをトリガーへ復元</text>
  <text x="630" y="468" font-size="11" fill="#334155">• isPending=true 中: onOpenChange(false) を無視しデータ不整合を防止</text>
  <text x="630" y="488" font-size="11" fill="#B91C1C">• window.alert() / window.confirm() / window.prompt() は全面禁止</text>
</svg>

