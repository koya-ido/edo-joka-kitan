  <text x="764" y="54" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">1x/2x</text>
  <rect x="794" y="38" width="48" height="24" rx="4" fill="none" stroke="#222222" stroke-width="1" />
  <text x="818" y="54" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">停止</text>

  
  <text x="441" y="76" font-size="11" fill="#111111">結界耐久</text>
  <rect x="490" y="66" width="250" height="12" rx="6" fill="none" stroke="#222222" stroke-width="1" />
  <rect x="490" y="66" width="210" height="12" rx="6" fill="none" stroke="#222222" stroke-width="1" />
  <text x="750" y="76" font-size="11" fill="#111111">420 / 500</text>

  
  <text x="441" y="102" font-size="11" font-weight="bold" fill="#111111">Lv.4</text>
