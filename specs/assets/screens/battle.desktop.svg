  <rect x="441" y="622" width="126" height="54" rx="6" fill="none" stroke="#222222" />
  <text x="504" y="646" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">銘刀・波紋</text>
  <text x="504" y="664" font-size="10" text-anchor="middle" fill="#111111">主武器（発動中）</text>
  <rect x="577" y="622" width="126" height="54" rx="6" fill="none" stroke="#666666" stroke-dasharray="4 3" />
  <text x="640" y="653" font-size="11" text-anchor="middle" fill="#111111">枠2（LvUPで開放）</text>
  <rect x="713" y="622" width="126" height="54" rx="6" fill="none" stroke="#666666" stroke-dasharray="4 3" />
  <text x="776" y="653" font-size="11" text-anchor="middle" fill="#111111">枠3（LvUPで開放）</text>

  
  <rect x="910" y="120" width="330" height="150" rx="8" fill="none" stroke="#666666" stroke-dasharray="4 4" />
  <text x="928" y="148" font-size="14" font-weight="bold" fill="#111111">操作・安全設計</text>
  <text x="928" y="176" font-size="12" fill="#111111">• 移動操作なし（完全オートエイム）</text>
  <text x="928" y="198" font-size="12" fill="#111111">• HUD通知は状態変化時のみReact同期</text>
  <text x="928" y="220" font-size="12" fill="#111111">• 例外時はループ安全停止＋エラーモーダル</text>
  <text x="928" y="242" font-size="12" fill="#111111">• モーダル表示中は背面HUD操作Disabled</text>
</svg>