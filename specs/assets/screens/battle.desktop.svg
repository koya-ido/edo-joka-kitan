<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="sans-serif">
  
  <rect width="1280" height="720" fill="#FFFFFF" />
  <text x="40" y="52" font-size="18" font-weight="bold" fill="#111111">SCR-03: ゲーム画面（バトル） — Desktop (1280×720)</text>
  <text x="40" y="76" font-size="13" fill="#111111">Canvas 2D（60fps独立ループ）の上に DOM オーバーレイ HUD・モーダルを重ねる構成</text>

  
  <rect x="40" y="120" width="330" height="210" rx="8" fill="none" stroke="#666666" stroke-dasharray="4 4" />
  <text x="58" y="148" font-size="14" font-weight="bold" fill="#111111">DOM オーバーレイ・モーダル群</text>
  <text x="58" y="176" font-size="12" fill="#111111">• 3択スキルモーダル（level_up_modal）:</text>
  <text x="58" y="196" font-size="12" fill="#111111">  基本強化(乗算) / 武器強化 / 武器開放</text>
  <text x="58" y="216" font-size="12" fill="#111111">  ＋ 勾玉消費の再抽選（不足時Disabled）</text>
  <text x="58" y="242" font-size="12" fill="#111111">• ポーズモーダル（paused）:</text>
  <text x="58" y="262" font-size="12" fill="#111111">  バフ一覧確認 / 再開 / 撤退（ステージ選択へ）</text>
  <text x="58" y="288" font-size="12" fill="#111111">• 勝敗リザルト（victory / defeat）:</text>
  <text x="58" y="308" font-size="12" fill="#111111">  報酬付与・敗北時は到達Wave救済勾玉</text>

  
  <rect x="415" y="20" width="450" height="680" rx="16" fill="none" stroke="#222222" stroke-width="2" />

  
  <rect x="427" y="32" width="426" height="86" rx="8" fill="none" stroke="#222222" />
