  <rect x="490" y="92" width="230" height="10" rx="5" fill="none" stroke="#222222" stroke-width="1" />

  
  <text x="640" y="146" font-size="11" text-anchor="middle" fill="#111111">Canvas 2D 戦闘描画領域（60fps）</text>

  
