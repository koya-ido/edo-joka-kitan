<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="sans-serif">
  
  <rect width="1280" height="720" fill="#FFFFFF" />
  <text x="40" y="52" font-size="18" font-weight="bold" fill="#111111">SCR-05: 強化画面（社・永続育成） — Desktop (1280×720)</text>
  <text x="40" y="76" font-size="13" fill="#111111">水晶の勾玉を消費して基礎ステータス（結界耐久 / 霊力攻撃 / 会心発生率）を加算方式で永続強化</text>

  
  <rect x="40" y="120" width="330" height="150" rx="8" fill="none" stroke="#666666" stroke-dasharray="4 4" />
  <text x="58" y="148" font-size="14" font-weight="bold" fill="#111111">永続強化・算出ルール</text>
  <text x="58" y="174" font-size="12" fill="#111111">• 算出式: 基礎値 + 覚醒加算 + (Lv × 固定値)</text>
  <text x="58" y="196" font-size="12" fill="#111111">• 保存中は全強化ボタンを一時Disabled</text>
  <text x="58" y="218" font-size="12" fill="#111111">• 勾玉不足時・最大Lv到達時はDisabled</text>
  <text x="58" y="240" font-size="12" fill="#111111">• 保存失敗時はロールバック＋エラー表示</text>

  
  <rect x="415" y="20" width="450" height="680" rx="16" fill="none" stroke="#222222" stroke-width="2" />

  
  <rect x="431" y="36" width="418" height="48" rx="8" fill="none" stroke="#222222" />
  <rect x="441" y="46" width="76" height="28" rx="6" fill="none" stroke="#222222" stroke-width="1" />
  <text x="479" y="64" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">← 戻る</text>
  <text x="580" y="65" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">社（永続強化）</text>
  <rect x="690" y="46" width="148" height="28" rx="14" fill="none" stroke="#222222" />
  <text x="764" y="64" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">水晶の勾玉: 100</text>

  
  <rect x="435" y="99.3" width="410" height="72.1" rx="10" fill="none" stroke="#222222" stroke-width="1" />
  <text x="455" y="119.9" font-size="12" font-weight="bold" fill="#111111">現在の総合基礎ステータス（装備反映）</text>
  <text x="500" y="149.1" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">結界耐久: 500</text>
  <text x="640" y="149.1" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">霊力攻撃: 40</text>
  <text x="780" y="149.1" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">会心発生率: 5%</text>

  
  <rect x="435" y="188.6" width="410" height="120.2" rx="10" fill="none" stroke="#222222" stroke-width="1.5" />
  <text x="455" y="212.7" font-size="16" font-weight="bold" fill="#111111">結界耐久</text>
