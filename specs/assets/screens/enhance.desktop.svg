  <text x="762" y="274.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">強化する</text>

  
  <rect x="435" y="324.3" width="410" height="120.2" rx="10" fill="none" stroke="#222222" stroke-width="1.5" />
