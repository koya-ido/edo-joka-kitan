<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="sans-serif">
  
  <rect width="1280" height="720" fill="#FFFFFF" />
  <text x="40" y="52" font-size="18" font-weight="bold" fill="#111111">SCR-06: 編成画面 — Desktop (1280×720)</text>
  <text x="40" y="76" font-size="13" fill="#111111">出撃する主人公1名（パッシブ）と持ち込み主武器1枠の選択・総合ステータスプレビュー</text>

  
  <rect x="40" y="120" width="330" height="184" rx="8" fill="none" stroke="#666666" stroke-dasharray="4 4" />
  <text x="58" y="148" font-size="14" font-weight="bold" fill="#111111">編成ルール・相互遷移</text>
  <text x="58" y="174" font-size="12" fill="#111111">• 持ち込み主武器は1枠のみ必須選択</text>
  <text x="58" y="196" font-size="12" fill="#111111">• 武器未装備（0枠）はエラーで拒否</text>
  <text x="58" y="218" font-size="12" fill="#111111">• 一覧には所持済みのみ表示（未解放非表示）</text>
  <text x="58" y="240" font-size="12" fill="#111111">• 「← 戻る」は遷移元（/ or /stages）へ復帰</text>
  <text x="58" y="262" font-size="12" fill="#111111">• 下部ボタンから /stages へ直接遷移可</text>

  
  <rect x="415" y="20" width="450" height="680" rx="16" fill="none" stroke="#222222" stroke-width="2" />

  
