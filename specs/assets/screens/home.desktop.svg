  <rect x="520" y="406" width="240" height="36" rx="6" fill="none" stroke="#222222" />
  <text x="640" y="429" font-size="12" text-anchor="middle" fill="#111111">持ち込み武器: 銘刀・波紋 (Lv.0)</text>

  
  <rect x="467" y="484" width="346" height="64" rx="10" fill="none" stroke="#222222" stroke-width="1" />
  <text x="640" y="523" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111">出撃する（ステージ選択へ）</text>

  
