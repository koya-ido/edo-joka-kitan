  <text x="928" y="174" font-size="12" fill="#111111">• Loading: 「霊脈接続中…」表示・遷移不可</text>
  <text x="928" y="196" font-size="12" fill="#111111">• Error: 再試行 / 初期化復旧導線</text>
  <text x="928" y="218" font-size="12" fill="#111111">• Disabled: ログボ受取済時は再受取不可</text>
