  <text x="798" y="64" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">初期化</text>

  
  <rect x="447" y="100" width="386" height="84" rx="8" fill="none" stroke="#222222" stroke-width="1" />
  <text x="640" y="136" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">穢土浄化奇譚</text>
  <text x="640" y="164" font-size="13" text-anchor="middle" fill="#111111">〜 妖魔祓ひの旅路 〜</text>

  
  <rect x="447" y="200" width="386" height="260" rx="12" fill="none" stroke="#222222" />
