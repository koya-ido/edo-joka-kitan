<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="sans-serif">
  
  <rect width="1280" height="720" fill="#FFFFFF" />
  <text x="40" y="52" font-size="18" font-weight="bold" fill="#111111">SCR-01: トップ画面（ホーム） — Desktop (1280×720)</text>
  <text x="40" y="76" font-size="13" fill="#111111">中央に縦型ゲームビューポート（450×680）を配置し、左右余白は和紙背景で中央寄せ</text>

  
  <rect x="40" y="120" width="330" height="160" rx="8" fill="none" stroke="#666666" stroke-dasharray="4 4" />
  <text x="58" y="148" font-size="14" font-weight="bold" fill="#111111">起動時・常設オーバーレイ</text>
  <text x="58" y="174" font-size="12" fill="#111111">• 初回起動時: 初期データ自動生成</text>
  <text x="58" y="196" font-size="12" fill="#111111">• 0:00境界未受取時: ログインボーナス</text>
  <text x="58" y="216" font-size="12" fill="#111111">  モーダルを自動表示</text>
  <text x="58" y="240" font-size="12" fill="#111111">• 初期化ボタン: カスタム確認モーダル経由</text>
  <text x="58" y="262" font-size="12" fill="#111111">  （window.confirm 禁止）</text>

  
  <rect x="415" y="20" width="450" height="680" rx="16" fill="none" stroke="#222222" stroke-width="2" />

  
  <rect x="431" y="36" width="418" height="48" rx="8" fill="none" stroke="#222222" />
  <rect x="441" y="46" width="108" height="28" rx="14" fill="none" stroke="#222222" />
  <text x="495" y="64" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">勾玉: 100</text>
